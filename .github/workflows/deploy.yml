name: Deploy to InfinityFree

on:
  push:
    branches:
      - main  # Triggers deployment whenever you push to the 'main' branch

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/    # Target directory on InfinityFree
          local-dir: ./          # Uploads files from the root of your repository so you can push and update data instantly
